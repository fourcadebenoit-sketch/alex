[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alex-sharepoint"
version = "1.0.0"
description = "Application locale ALEX, analyses et validations sur liste SharePoint Online"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["msal>=1.31,<2", "requests>=2.32.4,<3"]

[project.scripts]
alex = "alex_sharepoint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alex_sharepoint = ["assets/*.html", "assets/*.js", "provisioning/*.json", "provisioning/*.ps1"]
